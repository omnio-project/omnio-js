packages:
  [
    "omnio",
    "packages/core",
    "packages/idx-pglite",
    "packages/idx-sqlite.wasm",
    "packages/emb-gemma2",
    "website",
  ]

minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude:
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
  - "@oxlint/*"
  - "@tai-kun/blume-integrations"
  - "@tai-kun/vp-lint-plugins"
  - "@unikvs/*"
  - "@vitest/*"
  - "@voidzero-dev/*"
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - unikvs
  - vite-plus
  - vitest

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@pierre/theme"
  - "@vercel/*"
  - "chokidar"
  - "semver"
  - "undici-types"

strictDepBuilds: true
onlyBuiltDependencies: []
allowBuilds:
  esbuild: true

update:
  ignoreDeps:
    - "*" # パッケージの更新は ncu に任せます。

catalog:
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-istanbul": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  playwright: 1.64.1
  vite-plus: 1.3.0
  vitest-browser-react: 2.3.0
overrides:
  dompurify: 3.4.17
